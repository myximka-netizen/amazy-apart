name: Build and test Volshebno Tut CRM APK
on:
  workflow_dispatch:
  push:
    branches: [chatwoot-mobile-client]
    paths:
      - 'chatwoot-android/**'
      - '.github/workflows/build-chatwoot-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: chatwoot-android
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK cryptographic signature and Android manifest
        run: |
          APK=chatwoot-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r chatwoot-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ru.amazy.crm/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -E 'ru.amazy.crm|mResumedActivity'
            adb shell pidof ru.amazy.crm
      - name: Publish install-tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Volshebno-Tut-CRM-Android-tested-APK
          path: chatwoot-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
