name: Web bridge tests
on:
  push:
    branches: [chatwoot-web-bridge]
    paths: [web-bridge/**, .github/workflows/web-bridge-test.yml]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.64.1 fastapi==0.115.12 uvicorn==0.34.2 httpx==0.28.1
      - run: python -m unittest discover -s web-bridge -v
      - run: docker build -t web-bridge-ci web-bridge
