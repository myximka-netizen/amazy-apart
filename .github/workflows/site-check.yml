name: Site checks
on:
  push:
    branches: [main, codex/site-plan]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify:build
      - name: Check desktop and mobile layout
        run: |
          npm install --prefix /tmp/amazy-browser-check --no-save --package-lock=false playwright@1.56.1
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/amazy-preview.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          AMAZY_BROWSER_TOOLS=/tmp/amazy-browser-check node scripts/check-layout.cjs
      - name: Save layout screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: layout-screenshots
          path: artifacts/layout/
          retention-days: 7
          if-no-files-found: ignore
