name: Build native Android CRM APK
on:
  workflow_dispatch:
  push:
    branches: [chatwoot-native-client]
    paths:
      - 'chatwoot-native/**'
      - '.github/workflows/build-chatwoot-native-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile native APK
        working-directory: chatwoot-native
        run: gradle :app:assembleDebug --no-daemon
      - name: Check APK signature and package
        run: |
          APK=chatwoot-native/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -22
      - name: Enable emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r chatwoot-native/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n ru.amazy.crm.nativeclient/.MainActivity
            sleep 5
            adb shell pidof ru.amazy.crm.nativeclient
      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: Volshebno-Tut-CRM-Native-APK
          path: chatwoot-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
