plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'ru.amazy.crm.nativeclient'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.amazy.crm.nativeclient'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.4.0-firebase'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Firebase client identifiers are embedded at build time from app/google-services.json.
// Never include server-side Firebase service account credentials in this module.
dependencies {
    implementation 'com.google.firebase:firebase-messaging:26.0.2'
}
